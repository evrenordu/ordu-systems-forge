name: Client Bundle Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client-bundle-guard:
    name: Block server-only code in client bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run client bundle guard
        run: bunx vitest run src/lib/__tests__/client-bundle-guard.test.ts
